name: Sync channel catalog

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Refresh category channels and discovery index
        run: npm run sync:iptv
      - name: Check for changes
        id: diff
        run: |
          if [ -z "$(git status --porcelain -- public/data/category public/data/discovery.json public/data/category-report.json)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git status --short -- public/data/category public/data/discovery.json public/data/category-report.json
          fi
      - name: Commit and push synced data
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/category public/data/discovery.json public/data/category-report.json
          git commit -m "data: refresh IPTV categories and discovery index"
          git push
