name: Sync and deploy Globe TV

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Fetch upstream at a recorded commit
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/famelack/famelack-data.git .upstream
          git -C .upstream sparse-checkout set tv/raw
          echo "UPSTREAM_SHA=$(git -C .upstream rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Validate and generate catalog
        run: npm run sync -- .upstream
      - run: npm run typecheck
      - run: npm test
      - name: Build site
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
